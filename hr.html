<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HR Links · ATASK</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--muted:#5b6472;--line:#e3e6eb;--accent:#b4232c;--ok:#1d7a46}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:24px 16px 60px}
.brand{font-weight:700;margin-bottom:16px}.brand small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font:inherit}
textarea{resize:vertical;font-size:14px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.row>div{flex:1;min-width:200px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 18px;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);padding:6px 12px;font-weight:500}
.link{display:flex;gap:8px;align-items:center;margin:8px 0}.link input{font-size:13px;background:#fafbfc}
.err{color:var(--accent);font-size:14px;margin-top:8px}.ok{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.pill{border-radius:999px;padding:2px 9px;font-size:12px;background:#eef0f3;white-space:nowrap}.pill.done{background:#e5f4e4;color:var(--ok)}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
  <div class="brand">ATASK<small>HR — candidate links (Ruby on Rails Developer)</small></div>

  <div class="card" id="login">
    <h2>Sign in</h2>
    <div class="row"><div><label for="pass">HR passcode</label><input id="pass" type="password" autocomplete="current-password"></div>
    <div style="flex:0"><button id="b-login">Open</button></div></div>
    <div id="login-err" class="err"></div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h2>1. Create links for a candidate</h2>
      <p style="margin:0;color:var(--muted)">Only for candidates who meet the criteria (4+ years of Rails). Each link works once and only for that person.</p>
      <div class="row"><div><label for="cname">Candidate full name</label><input id="cname" type="text" maxlength="120" placeholder="e.g. Budi Santoso"></div>
      <div style="flex:0"><button id="b-create">Create links</button></div></div>
      <div id="create-err" class="err"></div>
      <div id="result" class="hidden" style="margin-top:14px">
        <b id="r-name"></b>
        <div class="link"><span style="width:120px">Interview form</span><input id="r-form" readonly><button class="ghost" data-copy="r-form">Copy</button></div>
        <div class="link"><span style="width:120px">Online test</span><input id="r-test" readonly><button class="ghost" data-copy="r-test">Copy</button></div>
        <label for="r-msg">Message to send (English) <button class="ghost" data-copy="r-msg" style="margin-left:6px">Copy message</button></label>
        <textarea id="r-msg" rows="11" readonly></textarea>
      </div>
    </div>

    <div class="card">
      <div class="row" style="align-items:center;justify-content:space-between"><h2 style="margin:0">2. Candidates</h2><button class="ghost" id="b-refresh">Refresh</button></div>
      <table><thead><tr><th>Name</th><th>Created</th><th>Interview form</th><th>Online test</th><th>Links</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </div>
</main>
<script>
(() => {
const API = "https://kivsoomahinmcbyxhhzt.supabase.co/functions/v1/api";
const BASE = location.origin + location.pathname.replace(/hr\.html$/, "");
const $ = id => document.getElementById(id);
let pass = "";
const fromLink = new URLSearchParams(location.hash.slice(1)).get("key") || new URLSearchParams(location.search).get("key");
if (fromLink) { pass = fromLink; history.replaceState(null, "", location.pathname); }
try { pass = pass || localStorage.getItem("hrpass") || ""; } catch (e) {}
const call = (route, body) => fetch(`${API}/${route}`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({passcode: pass, ...body})});
const links = slug => ({form: `${BASE}interview.html?c=${slug}`, test: `${BASE}?c=${slug}`});

async function list() {
  const r = await call("hr-list", {});
  if (!r.ok) return false;
  const {rows} = await r.json();
  $("rows").innerHTML = "";
  rows.forEach(x => {
    const l = links(x.slug), tr = document.createElement("tr");
    const pill = (t, done) => `<span class="pill${done ? " done" : ""}">${t}</span>`;
    tr.innerHTML = `<td></td><td>${new Date(x.created_at).toLocaleDateString("en-GB")}</td>
      <td>${pill(x.interview, x.interview === "submitted")}</td><td>${pill(x.test, x.test === "finished")}</td>
      <td><button class="ghost" data-l="${l.form}">Form</button> <button class="ghost" data-l="${l.test}">Test</button></td>`;
    tr.firstChild.textContent = x.name || x.slug;
    $("rows").appendChild(tr);
  });
  return true;
}
async function login() {
  pass = $("pass").value || pass;
  if (await list()) {
    try { localStorage.setItem("hrpass", pass); } catch (e) {}
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  } else { $("login-err").textContent = pass ? "This passcode didn't work. Use the personal HR link from Susan, or try again." : "Please open your personal HR link from Susan (it signs you in automatically), or type the passcode."; }
}
$("b-login").onclick = login;
$("pass").addEventListener("keydown", e => e.key === "Enter" && login());
if (pass) login();

$("b-create").onclick = async () => {
  $("create-err").textContent = ""; const name = $("cname").value.trim();
  if (name.length < 2) { $("create-err").textContent = "Enter the candidate's name."; return; }
  $("b-create").disabled = true;
  const r = await call("hr-invite", {name}); $("b-create").disabled = false;
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $("create-err").textContent = d.error || "Could not create the link."; return; }
  const l = links(d.slug), first = name.split(/\s+/)[0];
  $("r-name").textContent = name; $("r-form").value = l.form; $("r-test").value = l.test;
  $("r-msg").value = `Hi ${first},

Thank you for your interest in the Ruby on Rails Developer (AI Assistance) role at ATASK.

Next steps (both in English):
1. Interview form (about 20–30 minutes): ${l.form}
2. Online Rails assessment (about 20 minutes; camera and microphone on, laptop with Chrome/Edge/Firefox): ${l.test}

Each link is personal and works only once. Please complete both within 3 days.

Best regards,
Adila — ATASK`;
  $("result").classList.remove("hidden"); $("cname").value = ""; list();
};
document.addEventListener("click", e => {
  const c = e.target.dataset.copy, l = e.target.dataset.l;
  const text = c ? $(c).value : l;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => { const o = e.target.textContent; e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = o, 1200); });
});
$("b-refresh").onclick = list;
})();
</script>
</body>
</html>
